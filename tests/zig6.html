<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>zig6 visible sway via ::after</title>

<style>
body {
  padding: 40px;
  font-family: sans-serif;
}

/* исходный элемент — layout не трогаем */
.olga-snd {
  /* cursor: pointer;
  padding: 6px 10px;
  border: 1px solid #888;
  border-radius: 6px;
  background: #f5f5f5; */
  position: relative;
}

/* визуализация проигрывания */
.olga-snd.o-playing::after {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 10%;
  pointer-events: none;

  /* ВОТ ЧТО ДЕЛАЕТ ЭФФЕКТ ВИДИМЫМ */
  box-shadow:
    0 0 3px rgba(0, 63, 200, 0.788),
    0 0 12px rgba(200, 0, 140, 0.74);

  will-change: transform, opacity;
  transform: translateZ(0);

  animation: sndSway 1.5s cubic-bezier(.45,.05,.55,.95) infinite;
}

/* мягкое «покачивание» */
@keyframes sndSway {
  0%,100% {
    transform: translateY(0) scaleX(1);
    opacity: .5;
  }
  25% {
    transform: translateY(-1px) scaleX(1.05);
    opacity: .9;
  }
  75% {
    transform: translateY(1px) scaleX(0.95);
    opacity: .7;
  }
}
</style>
</head>

<body>

<p>
  В тексте:
  <span class="olga-snd o-playing">▶ аудио 1</span>
  — этот играет
</p>

<p>
  <span class="olga-snd">▶ аудио 2</span>
</p>

</body>
</html>

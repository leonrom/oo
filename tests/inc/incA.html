<body>
	<h3>Варианты селекторов подключения</h3>	
	<br />
	'./incA.html - всё содержимое iA.html'     
	<div id='1' data-o_include='./iA.html'      title="./incA.html"    ></div>  
	'./incA.html?#i2 - содержимое тега id='i2' iA.html' 
	<div id='2' data-o_include='./iA.html?#i2'  title="./incA.html?#i2"></div>  
	'./incA.html?#i2! - весь тег id='i2' iA.html'
	<div id='3' data-o_include='./iA.html?#i2!'  title="./incA.html?#i3"></div>  
	'./incA.html?.s1 - все с классом тег id='i2' iA.html' 
	<div id='4' data-o_include='./iA.html?!.s1'  title="./incA.html?.s1"></div>  
	'./incA.html?span - оба span'
	<div id='5' data-o_include='./iA.html?span' title="./incA.html?span"></div>  
	<br/>
	конец 'inc1.html'

</body>

<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <title>zig3</title>

  <style>
    body {
      padding: 40px;
      font-family: sans-serif;
    }

    .olga-snd {
      display: inline-block;
      align-items: center;
      gap: 8px;
    }

    div.olga-snd {
      padding: 10px 14px;
      border: 1px solid #888;
      border-radius: 8px;
    }

    /* состояние проигрывания */
    .olga-snd.o-playing {
      will-change: transform;
      transform: rotate(3deg) translateZ(0.001px);
      transform-origin: 50% 50%;
      animation: sndSwing 1.6s cubic-bezier(.45, .05, .55, .95) infinite;
    }

    @keyframes sndSwing {
      0%,      
      100% {        transform: rotate(0deg) translateZ(0);      }
      25% {        transform: rotate(3deg) translateZ(0);      }
      75% {        transform: rotate(-3deg) translateZ(0);      }
    }

    /* просто иконка */
    .icon {
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="olga-snd " id="i1">
    <span class="icon">🔊</span>
    <span>Играет аудио</span>
  </div>
  <br />
  <span class="olga-snd " id="i2">еще одно аудио</span>

  <script>
    const i1 = document.getElementById('i1')
    const i2 = document.getElementById('i2')
    const onClick = e => {
      const tag = e.target
      tag.classList.toggle('o-playing')
    }
    i1.addEventListener('click', onClick)
    i2.addEventListener('click', onClick)
  </script>
</body>

</html>

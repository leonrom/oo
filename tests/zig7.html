<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>zig7 — drop-shadow pulse</title>

<style>
body {
  padding: 40px;
  font-family: sans-serif;
}

/* Исходный элемент — НИЧЕГО не меняем */
.olga-snd {
  cursor: pointer;
  padding: 6px 10px;
  border: 1px solid #888;
  border-radius: 6px;
  background: #f5f5f5;
}

/* Включается ТОЛЬКО во время playing */
.olga-snd.o-playing {
  animation: sndGlow 1.4s ease-in-out infinite;
}

/* Пульсирующий ореол */
@keyframes sndGlow {
  0% {    filter: drop-shadow(0 0 4px yellow);  }
  50% {    filter: drop-shadow(0 0 8px blue);  }
  100% {    filter: drop-shadow(0 0 4px red);  }
}
</style>
</head>

<body>

<p>
  В тексте:
  <span class="olga-snd o-playing">▶ аудио 1</span>
  — сейчас играет
</p>

<p>
  <span class="olga-snd">▶ аудио 2</span>
  — молчит
</p>

<p>
  Иконка:
  <img class="olga-snd o-playing"
       src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Speaker_Icon.svg"
       alt="speaker"
       width="24">
</p>

</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>3b</title>

<style>
body {
  padding: 40px;
  font-family: sans-serif;
}

.olga-snd {
  display: inline-flex;
  align-items: center;
  gap: 8px;

  padding: 10px 14px;
  border: 1px solid #888;
  border-radius: 8px;
}

/* состояние проигрывания */
.olga-snd.o-playing {
  will-change: transform;
  transform: translateZ(0);
  transform-origin: 50% 50%;
  animation: sndSkew 1.6s ease-in-out infinite;
}

@keyframes sndSkew {
  0%,100% { transform: skewX(0deg); }
  25%     { transform: skewX(3deg); }
  75%     { transform: skewX(-3deg); }
}
/* просто иконка */
.icon {
  font-size: 20px;
}
</style>
</head>

<body>

<div class="olga-snd o-playing">
  <span class="icon">🔊</span>
  <span>Играет аудио</span>
</div>

</body>
</html>

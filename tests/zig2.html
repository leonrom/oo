<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SVG snake — universal</title>

<style>
body {
  padding: 40px;
  font-family: sans-serif;
}

/* контейнер */
.box {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: #222;
  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  position: relative;
}

/* SVG поверх */
.box.playing svg {
  position: absolute;
  inset: -6px;
  pointer-events: none;
}

/* сама змейка */
.box.playing circle {
  fill: none;
  stroke: lime;
  stroke-width: 4;

  stroke-dasharray: 20 40;
  animation: dash 1.2s linear infinite;
}

@keyframes dash {
  to {
    stroke-dashoffset: -60;
  }
}
</style>
</head>

<body>

<div class="box playing">
  audio

  <svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="48" />
  </svg>
</div>

</body>
</html>

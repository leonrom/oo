                .replace(/$|;|,\s*,|\s+,\s+/g, ',')
            console.log('   ', z._needs, 
            `\ns1= ${s1}`,
            `\ns2= ${s2}`,
            `\nss= ${ss.join(', ')}`
        )
        }

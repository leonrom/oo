<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Audio playing — pulse + glow</title>

<style>
body {
  padding: 40px;
  font-family: sans-serif;
}

.olga-snd {
  display: inline-flex;
  align-items: center;
  gap: 8px;

  padding: 10px 14px;
  border: 1px solid #888;
  border-radius: 8px;

  position: relative;
}

/* проигрывается */
.olga-snd.o-playing {
  animation: pulse 1.4s ease-in-out infinite;
}

/* ореол */
.olga-snd.o-playing::after {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: inherit;
  pointer-events: none;

  box-shadow:
    0 0 6px rgba(0,255,0,.45),
    0 0 14px rgba(0,255,0,.25);

  animation: glow 1.4s ease-in-out infinite;
}

@keyframes pulse {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.03); }
  100% { transform: scale(1); }
}

@keyframes glow {
  0%   { opacity: .4; }
  50%  { opacity: .9; }
  100% { opacity: .4; }
}

.icon {
  font-size: 20px;
}
</style>
</head>

<body>


  <div class="olga-snd " id="i1">
    <span class="icon">🔊</span>
    <span>Играет аудио</span>
  </div>
  <br />
  <span class="olga-snd " id="i2">еще одно аудио</span>

  <script>
    const i1 = document.getElementById('i1')
    const i2 = document.getElementById('i2')
    const onClick = e => {
      const tag = e.target
      tag.classList.toggle('o-playing')
    }
    i1.addEventListener('click', onClick)
    i2.addEventListener('click', onClick)
  </script>

</body>
</html>

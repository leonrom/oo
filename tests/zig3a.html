<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>3a</title>

<style>
body {
  padding: 40px;
  font-family: sans-serif;
}

.olga-snd {
  display: inline-flex;
  align-items: center;
  gap: 8px;

  padding: 10px 14px;
  border: 1px solid #888;
  border-radius: 8px;
}

/* состояние проигрывания */
.olga-snd.o-playing {
  will-change: transform;
  transform: translateZ(0);
  animation: sndSway 1.5s cubic-bezier(.45,.05,.55,.95) infinite;
}

@keyframes sndSway {
  0%,100% {    transform: translateY(0) scaleX(1);  }
  25% {    transform: translateY(-1px) scaleX(1.02);  }
  75% {    transform: translateY(1px) scaleX(0.98);  }
}
/* просто иконка */
.icon {
  font-size: 20px;
}
</style>
</head>

<body>

<div class="olga-snd o-playing">
  <span class="icon">🔊</span>
  <span>Играет аудио</span>
</div>

</body>
</html>
